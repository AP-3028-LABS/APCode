name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: test install script against just-built release
  test-install:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          check-latest: true
      - name: Test install.sh --help
        run: bash install.sh --help
      - name: Test install from binary (build locally)
        run: |
          go build -ldflags "-X apcode/internal/config.Version=test" -o /tmp/apcode ./cmd/apcode
          bash install.sh --binary /tmp/apcode --dir /tmp/apcode-test --no-modify-path
          /tmp/apcode-test/apcode --version
          /tmp/apcode-test/apcode version
          /tmp/apcode-test/apcode --help
