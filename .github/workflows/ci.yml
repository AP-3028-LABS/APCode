name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          # fallback to go.mod if version not yet available in cache
          check-latest: true
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code -- . || (echo "Run 'go fmt ./...' and commit" && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (no race)
        shell: bash
        run: |
          set -o pipefail
          go test ./... -count=1 -v 2>&1 | tee /tmp/test.log
          EXIT=${PIPESTATUS[0]}
          # Always show tail for debugging on failure
          if [ $EXIT -ne 0 ]; then
            echo "### Test failures on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(=== RUN|--- FAIL|--- PASS|FAIL|ok|FAIL)" /tmp/test.log | tail -n 100 >> $GITHUB_STEP_SUMMARY || true
            grep -A2 "--- FAIL" /tmp/test.log | head -n 200 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT
      - name: Test (race)
        # Race detector needs cgo and is slow/flaky on macOS/Windows. Run only on ubuntu where it is reliable.
        # Keep overall CI green by not blocking other OSes on race failures; ubuntu race still validates concurrency.
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |
          set -o pipefail
          go test -race ./... -count=1 -v 2>&1 | tee /tmp/test-race.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "### Race failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(=== RUN|--- FAIL|FAIL)" /tmp/test-race.log | tail -n 100 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            go build -ldflags "-X apcode/internal/config.Version=test" -o apcode.exe ./cmd/apcode
          else
            go build -ldflags "-X apcode/internal/config.Version=test" -o apcode ./cmd/apcode
          fi
      - name: Verify binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./apcode.exe --version
            ./apcode.exe --help | head -n 20
            ./apcode.exe version
          else
            ./apcode --version
            ./apcode --help | head -n 20
            ./apcode version
          fi

  verify-scripts:
    name: Verify install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh syntax
        run: bash -n install.sh
      - name: Check install.sh help
        run: bash install.sh --help
      - name: Check PowerShell syntax (if pwsh available)
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command "Get-Content install.ps1 | Out-Null; Write-Host 'ps1 ok'"
          else
            echo "pwsh not available, skipped"
          fi
