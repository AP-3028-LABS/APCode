# GoReleaser config for APCode — produces binaries like opencode's releases
# Usage locally: goreleaser build --snapshot --clean
# Usage release: goreleaser release --clean (triggered by git tag v*)

version: 2

project_name: apcode

before:
  hooks:
    - go mod tidy

builds:
  - id: apcode
    main: ./cmd/apcode
    binary: apcode
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X apcode/internal/config.Version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: apcode-archive
    # GoReleaser appends the archive extension itself (.zip for windows via
    # format_overrides below, .tar.gz otherwise).
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "Other"
      order: 999

release:
  github:
    owner: AP-3028-LABS
    name: APCode
  prerelease: auto
  draft: false
  footer: |
    ### Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/AP-3028-LABS/APCode/main/install.sh | bash
    ```

    ```powershell
    irm https://raw.githubusercontent.com/AP-3028-LABS/APCode/main/install.ps1 | iex
    ```

    Or download the binary for your platform below and add to PATH.

    ### Verify

    ```
    apcode --version
    apcode --help
    ```
